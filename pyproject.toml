[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "semburst"
version = "0.1.0"
description = "Semantic burstiness of literary texts: embedding trajectories, PCA, burstiness spectra, null models"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "nltk==3.9.1",
    "gensim",
]

[tool.setuptools.packages.find]
where = ["src"]
